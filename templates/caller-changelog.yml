name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  changelog:
    # Granted here, not in the reusable workflow: a called workflow can only narrow the
    # caller's token, never widen it, and this repo's default is read-only.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: Ikigai-Systems/release-kit/.github/workflows/changelog-pr.yml@master
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
